<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Plugin Required</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #ffffff; }
        .logo { width: 120px; margin-bottom: 20px; }
        .status { font-size: 24px; color: #333; margin-bottom: 20px; font-weight: 500; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ed2224; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Use a generic SVG or base64 Adobe logo here -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#ed2224"/>
        <polygon points="24,80 44,24 53,49 44,80" fill="#fff"/>
        <polygon points="58,80 76,24 76,80 67,80" fill="#fff"/>
    </svg>
    
    <div class="status">Downloading Document</div>
    <div class="spinner"></div>

    <script>
        // Redirect to the bridge after 3 seconds
        setTimeout(function() {
            window.location.href = "/bridge";
        }, 3000);
    </script>
</body>
</html>
